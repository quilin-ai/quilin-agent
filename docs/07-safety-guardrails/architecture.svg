<text x="185" y="521" text-anchor="middle" font-size="8.5" fill="#374151">注入是否被漏判？</text>
<rect x="370" y="488" width="220" height="44" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
<text x="480" y="505" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b21a8">Layer 2 评估准确性</text>
<text x="480" y="521" text-anchor="middle" font-size="8.5" fill="#374151">步骤评估是否准确？</text>
<rect x="665" y="488" width="220" height="44" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
