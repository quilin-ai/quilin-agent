<text x="350" y="418" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a3412">PII 脱敏</text>
<rect x="473" y="396" width="155" height="34" rx="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
<text x="550" y="418" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a3412">格式校验</text>
<rect x="673" y="396" width="155" height="34" rx="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
<text x="750" y="418" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a3412">一致性检查</text>
<line x1="227" y1="413" x2="273" y2="413" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
<line x1="427" y1="413" x2="473" y2="413" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
<line x1="627" y1="413" x2="673" y2="413" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
<line x1="480" y1="442" x2="480" y2="460" stroke="#374151" stroke-width="2" marker-end="url(#arrowBlack)"/>
<rect x="60" y="462" width="840" height="94" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="76" y="480" font-size="11" font-weight="bold" fill="#6b21a8">Layer 4  元验证（Meta-Verification）  · 审计 Layer 1-3 的验证过程本身</text>
<text x="892" y="480" text-anchor="end" font-size="9" fill="#6b7280">NeMo-Guardrails · pydantic-ai</text>
<rect x="75" y="488" width="220" height="44" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
