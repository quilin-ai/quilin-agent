<rect x="60" y="370" width="840" height="72" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="76" y="388" font-size="11" font-weight="bold" fill="#9a3412">Layer 3  输出验证（Output Validation）</text>
<text x="892" y="388" text-anchor="end" font-size="9" fill="#6b7280">guardrails-ai · vigil-llm</text>
<rect x="73" y="396" width="155" height="34" rx="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
