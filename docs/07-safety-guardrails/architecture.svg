<rect width="960" height="640" fill="#ffffff"/>
<text x="480" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Quilin Agent — 4-Layer Safety Guardrails</text>
<text x="480" y="46" text-anchor="middle" font-size="10" fill="#6b7280">Input Validation → Step Verification → Output Validation → Meta-Verification → Safe Output</text>
<rect x="370" y="60" width="220" height="34" rx="17" fill="#1e40af"/>
<text x="480" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">用户输入 / 外部数据</text>
