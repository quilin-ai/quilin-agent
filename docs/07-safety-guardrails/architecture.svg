<text x="110" y="159" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">规则匹配</text>
<text x="110" y="172" text-anchor="middle" font-size="8.5" fill="#374151">注入模式 / 黑名单</text>
<text x="110" y="184" text-anchor="middle" font-size="8.5" fill="#374151">&lt;1ms · 极低成本</text>
<rect x="300" y="143" width="180" height="50" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="390" y="159" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">ML 分类器</text>
<text x="390" y="172" text-anchor="middle" font-size="8.5" fill="#374151">DeBERTa / BERT</text>
<text x="390" y="184" text-anchor="middle" font-size="8.5" fill="#374151">10–50ms · 低成本</text>
<rect x="580" y="143" width="180" height="50" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="670" y="159" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">LLM 判断</text>
<text x="670" y="172" text-anchor="middle" font-size="8.5" fill="#374151">小型 LLM 裁判</text>
<text x="670" y="184" text-anchor="middle" font-size="8.5" fill="#374151">500ms–2s · 中成本</text>
<line x1="200" y1="168" x2="300" y2="168" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
<rect x="216" y="157" width="68" height="13" rx="3" fill="#f0fdf4"/>
<text x="250" y="168" text-anchor="middle" font-size="8.5" fill="#059669">正常通过</text>
<line x1="480" y1="168" x2="580" y2="168" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
<rect x="496" y="157" width="68" height="13" rx="3" fill="#f0fdf4"/>
<text x="530" y="168" text-anchor="middle" font-size="8.5" fill="#059669">正常通过</text>
<line x1="480" y1="193" x2="480" y2="213" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
<rect x="396" y="194" width="168" height="13" rx="3" fill="#fef2f2"/>
<text x="480" y="204" text-anchor="middle" font-size="8.5" fill="#dc2626">威胁 → 拦截 + 记录</text>
<line x1="480" y1="208" x2="480" y2="228" stroke="#374151" stroke-width="2" marker-end="url(#arrowBlack)"/>
<rect x="396" y="209" width="168" height="13" rx="3" fill="#f0fdf4"/>
<text x="480" y="220" text-anchor="middle" font-size="8.5" fill="#059669">验证通过 → Agent 推理循环</text>
<rect x="60" y="230" width="840" height="118" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
<text x="76" y="248" font-size="11" font-weight="bold" fill="#065f46">Layer 2  步骤验证（Step-Level Verification）  · 每次工具调用后执行</text>
<text x="892" y="248" text-anchor="end" font-size="9" fill="#6b7280">Hooks: PreToolUse / PostToolUse / Stop</text>
<rect x="65" y="256" width="210" height="66" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
<text x="170" y="271" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">① 期望匹配</text>
<text x="170" y="285" text-anchor="middle" font-size="8.5" fill="#374151">结果是否符合预期？</text>
<text x="170" y="298" text-anchor="middle" font-size="8.5" fill="#374151">完全/部分/不符合/异常</text>
<rect x="375" y="256" width="210" height="66" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
<text x="480" y="271" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">② 目标推进</text>
<text x="480" y="285" text-anchor="middle" font-size="8.5" fill="#374151">结果是否推进任务目标？</text>
<text x="480" y="298" text-anchor="middle" font-size="8.5" fill="#374151">正向/中性/偏离</text>
<rect x="685" y="256" width="210" height="66" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
<text x="790" y="271" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">③ 异常检测</text>
<text x="790" y="285" text-anchor="middle" font-size="8.5" fill="#374151">结果是否含可疑内容？</text>
<text x="790" y="298" text-anchor="middle" font-size="8.5" fill="#374151">触发权限边界检查</text>
<text x="170" y="314" text-anchor="middle" font-size="8" fill="#6b7280">read→规则  write→ML  exec→LLM</text>
<text x="480" y="314" text-anchor="middle" font-size="8" fill="#ea580c">偏离 → 触发重规划</text>
<text x="790" y="314" text-anchor="middle" font-size="8" fill="#dc2626">疑似注入 → 立即停止</text>
<line x1="275" y1="289" x2="375" y2="289" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
<line x1="585" y1="289" x2="685" y2="289" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
<text x="892" y="344" text-anchor="end" font-size="9" fill="#6b7280">pydantic-ai · NeMo-Guardrails</text>
