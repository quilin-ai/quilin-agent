name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile
      - run: cd providers/memory && uv sync --extra dev
      - run: cd packages/agent-core && bun run biome check src/
      - run: cd packages/agent-core && bunx tsc --noEmit --pretty false
      - run: cd packages/agent-core && bun run test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: cd providers/memory && uv sync --extra dev
      - run: cd providers/memory && uv run ruff check src/
      - run: cd providers/memory && uv run pytest

  # Rust job removed 2026-04-22 — repo has no Cargo.toml / crates/ yet.
  # Re-add when Iter D lands the mesh/WASM sandbox crates. Until then the
  # job only burned CI minutes on a missing workspace.
