[project]
name = "quilin-web"
version = "0.0.1"
description = "Quilin web provider — Crawl4AI-backed clean-markdown extraction as MCP Server"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.27.0",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
crawler = [
    "crawl4ai>=0.4.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quilin_web"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/quilin_web --cov-fail-under=95 --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "src/quilin_web/__main__.py",
]

[project.scripts]
quilin-web = "quilin_web.server:main"
