[project]
name = "quilin-optimizer"
version = "0.0.2"
description = "Quilin offline optimizer — DSPy/GEPA MCP server (singular optimizer; MIPROv2 + PromptRewrite removed 2026-05-12)"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.27.0",
    "structlog>=25.5.0",
    # DSPy + GEPA is the singular self-evolution optimizer; required at
    # install time so the agent's self-evolution path works out of the box.
    # GEPA was accepted at ICLR 2026 (Oral) and is DSPy's recommended SOTA
    # optimizer. MIPROv2 (the prior alternative compiler) and the TS
    # PromptRewrite heuristic were removed 2026-05-12 — see
    # docs/10-self-evolution/README.md §2.4 for the decision rationale.
    "dspy-ai>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quilin_optimizer"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/quilin_optimizer --cov-fail-under=95 --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "src/quilin_optimizer/__main__.py",
    "src/quilin_optimizer/logging.py",
]

[project.scripts]
quilin-optimizer = "quilin_optimizer.server:main"
