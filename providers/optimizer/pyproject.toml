[project]
name = "quilin-optimizer"
version = "0.0.2"
description = "Quilin offline optimizer — DSPy/GEPA-backed MCP server (Stage C: real integration with lazy import + graceful degrade)"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.27.0",
    "structlog>=25.5.0",
]

# IMPORTANT: dspy-ai is OPT-IN via the `dspy` extra. The default install MUST
# NOT pull dspy-ai (heavy dep tree: torch/litellm/optuna/...). The optimizer
# server imports `dspy` lazily inside the `optimize` tool body so a missing
# extra produces a structured "DSPy unavailable" warning instead of an
# import-time crash.
#
# 关键约束：dspy-ai 通过 `dspy` extra 选装。默认安装不拉 dspy-ai
# （依赖树包含 torch/litellm/optuna 等重型依赖）。server 在 `optimize` 工具
# 内部 lazy import `dspy`，缺失 extra 时产生结构化告警，不会在导入期崩溃。
[project.optional-dependencies]
dspy = [
    "dspy-ai>=2.5",
    # MIPROv2 internally calls `optuna` for Bayesian instruction search;
    # DSPy lists it as an optional extra (`dspy[optuna]`) but our
    # graceful-degrade path can't surface "missing optuna" as nicely as
    # "missing dspy-ai", so we pull it eagerly when the user opts into
    # the dspy extra. Adds ~5 MB.
    "optuna>=3.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quilin_optimizer"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/quilin_optimizer --cov-fail-under=95 --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "src/quilin_optimizer/__main__.py",
    "src/quilin_optimizer/logging.py",
]

[project.scripts]
quilin-optimizer = "quilin_optimizer.server:main"
