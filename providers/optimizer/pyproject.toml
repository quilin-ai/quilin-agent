[project]
name = "quilin-optimizer"
version = "0.0.1"
description = "Quilin offline optimizer — DSPy/GEPA placeholder MCP Server (Stage A+B; real integration deferred to Stage C+)"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.27.0",
    "structlog>=25.5.0",
]

# IMPORTANT: Stage A intentionally does NOT depend on dspy-ai.
# Stage C will add `dspy-ai` to a `dspy` optional-dependency extra and swap the
# placeholder `optimize` implementation in for a real prompt-optimization run.
#
# 关键约束：Stage A 故意不引入 dspy-ai 依赖。
# Stage C 才会将 `dspy-ai` 加到 `dspy` 这一可选依赖 extra 中，
# 并把 `optimize` 占位实现替换为真实 prompt 优化逻辑。
[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quilin_optimizer"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/quilin_optimizer --cov-fail-under=95 --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "src/quilin_optimizer/__main__.py",
    "src/quilin_optimizer/logging.py",
]

[project.scripts]
quilin-optimizer = "quilin_optimizer.server:main"
