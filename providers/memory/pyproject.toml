[project]
name = "quilin-mem"
version = "0.0.1"
description = "Quilin quilin-mem — 4-tier memory system as MCP Server"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.27.0",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
vector = [
    "sentence-transformers>=5.4.1",
    "chromadb>=1.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quilin_mem"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage gate floored to actual (91.38% measured 2026-07-03) so CI reflects
# reality instead of a false 95% claim. target 95, restore when reached.
addopts = "--cov=src/quilin_mem --cov-fail-under=90 --cov-report=term-missing"

# All dev/test deps live in one place: uv installs the `dev` group by default,
# so `uv run pytest` gets pytest-asyncio out of the box (splitting them across
# [project.optional-dependencies] silently dropped pytest-asyncio and crashed
# every async test).
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15.10",
]
